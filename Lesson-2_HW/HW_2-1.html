<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    body{
        background-color: antiquewhite;
    }
    h1{
        text-align: center;
        padding: 50px;
    }
    .flex-container{
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        padding: 15px 0;
    }
    .flex-item{
        width: 250px;
        height: 300px;
        border: 1px solid black;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;

    }
    .flex-item img{
        width: 80%;
        height: 62%;
    }
    .flex-item p{
        font-size: 20px;
        font-weight:bold;
    }
</style>
</head>
<body>
<h1> What do I have in my fridge?</h1>
<div class="flex-container">
    <div class="flex-item">
        <img src="https://www.veggipedia.nl/_next/image?url=https%3A%2F%2Fveggipedia-cms.production.taks.zooma.cloud%2Fassets%2FUploads%2FProducts%2FOranje-paprika-groenten-Veggipedia__FitMaxWzYwMCw2MDBd.png&w=3840&q=75" alt="#">
        <p>Pepper</p>
    </div>
    <div class="flex-item">
        <img src="https://buybc.gov.bc.ca/app/uploads/sites/386/2024/03/Apple_260802153.png" alt="#">
        <p>Apple</p>
    </div>
    <div class="flex-item">
        <img src="https://www.cibimarket.co.uk/cdn/shop/files/3e16ff91-9541-412f-8562-b5cf2bdb139f_removalai_preview_1.png?v=1751616648&width=1214" alt="#">
        <p>Cheese</p>
    </div>
    <div class="flex-item">
        <img src="https://buybc.gov.bc.ca/app/uploads/sites/386/2024/03/Corn_64348386.png" alt="#">
        <p>Corn</p>
    </div>
    <div class="flex-item">
        <img src="https://huongvietstore.co.uk/cdn/shop/files/162741-800-800.png?v=1741702207&width=1214" alt="#">
        <p>Mushrooms</p>
    </div>
    <div class="flex-item">
        <img src="https://images.gopuff.com/blob/gopuffcatalogstorageprod/catalog-images-container/resize/cf/version=1_2,format=auto,fit=scale-down,width=800,height=800/6b574b22-6a70-4f49-bbee-ae996fa7b5d9-background_removed.png" alt="#">
        <p>Garlic</p>
    </div>
    <div class="flex-item">
        <img src="https://www.maisonmorandparis.com/cdn/shop/files/500x500-removebg-preview.png?v=1750142117" alt="#">
        <p>Beef</p>
    </div>
    <div class="flex-item">
        <img src="https://i0.wp.com/mykosherfish.com/wp-content/uploads/2026/05/MKF_Dry-Aged-Branzino-e1778696629569.png?resize=420%2C420&ssl=1" alt="#">
        <p>Fish</p>
    </div>
    <div class="flex-item">
        <img src="https://www.gurkerl.at/cdn-cgi/image/f=auto,w=800,h=800,q=75/https://cdn.gurkerl.at/images/grocery/products/45667/45667-1761213408592469879.png" alt="#">
        <p>Eggs</p>
    </div>
    <div class="flex-item">
        <img src="https://suneethafoods.com/cdn/shop/products/Coriander-Suneetha_20Foods-Fresh_20Veggies_20_26_20Fruits.png?v=1620826076" alt="#">
        <p>Coriander</p>
    </div>
</div>
<hr>
<p style="text-align: center; padding: 20px 0px">...that's all...</p>
</body>
</html>
