<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            margin: 0;
        }
        .flex-container{
            height: 500px;
            width: 100%;
            background-color: #6c6868;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .item{
            height: 100px;
            width: 100px;
            background-color: red;
            transition: 5s;
        }
        .item:hover{
            border-radius: 50%;
            background-color: yellow;
            transition: 2s;

}
    </style>
</head>
<body>
<div class="flex-container">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>

</div>

</body>
</html>
