<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 150px;
        }
        .box {
            width: 150px;
            height: 150px;
            background-color: darkturquoise;
            animation: preloader 5s  infinite ;
        }
        @keyframes preloader {
            0% {

                transform: rotateY(0deg);
            }
            100% {
                transform: rotateX(-360deg);
            }

        }
    </style>
</head>
<body>
<div class="box"></div>

</body>
</html>
