<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
                margin: 0;
        }
        .wrapper{
    display: grid;
    height: 100vh;
    background: gray;
    grid-template-columns: 1fr 1fr 1fr;
            /*gap: 30px ;*/
            grid-row-gap: 10px;
}
        .item{
background:pink;
border: 1px solid ;
display: flex;
justify-content:center;
align-items: center;
        }
        .wrapper div:nth-child(5) {
            background: #3F5EFB;
        }

    </style>

</head>
<body>
<div class="wrapper">
    <div class="item">
        <p>Lorem ipsum dolor.</p>
    </div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
</div>

</body>
</html>
