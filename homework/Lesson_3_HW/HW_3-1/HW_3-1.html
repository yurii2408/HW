    <section> <p> content </p></section>

<!--<p>[00:14] Для розмітки використовуються семантичні теги; три секції обгортаються в div-контейнер для горизонтального розташування.</p>-->

<!--<p>[01:39] Для секцій задаються висота, ширина близько 32% та фоновий колір.</p>-->
<!--<p>[02:05] Footer отримує висоту 90vh і той самий колір, що й header.</p>-->
<!--<p>[02:18] Після першого перегляду результату помітно відсутність зовнішніх відступів.</p>-->
<!--<p>[02:30] Для body додаються зовнішні відступи (`margin`), щоб створити простір навколо контенту.</p>-->
<!--<p>[02:44] Для контейнера секцій додаються вертикальні внутрішні відступи (`padding-top` і `padding-bottom`)</p>-->

<!--<p>[03:35] Header, секції та footer перетворюються на flex-контейнери для центрування тексту по горизонталі та вертикалі.</p>-->
