<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 100px;
        }
      .triangle {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid green;
          animation: preloader 5s ease infinite alternate;
        }
        .triangle2{
            margin-top: 100px;
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-top:  100px solid red;
            animation: preloader 5s ease-in infinite alternate;
        }
      @keyframes preloader {
          from{
              transform: rotate(360deg);
          }
          50%{
              transform: rotate(180deg);
          }
          to{
              transform: rotate(-360deg) scale(1.5);
          }
      }
    </style>
</head>
<body>
<div class="triangle"></div>
<div class="triangle2"></div>
</body>
</html>
