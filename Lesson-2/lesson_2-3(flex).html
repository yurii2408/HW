<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            margin: 0;
        }
        body{
            height: 100vh;
        }
       .box{
           width: 200px;
           height: 200px;
           background-color: lightgreen;
       }
       .red{
           background-color: red;
           display: flex;
           justify-content: center;
           align-items: center;
           flex-direction: column;
       }
       .red img{
           width: 50%;
       }
       .red p{
         text-align: center;
       }
       .yellow{
           background-color: yellow;
       }
       .green{
           background-color: green;
       }
       .flex{
           height: 100%;
           background-color: burlywood;
           display: flex;
           justify-content: center;
           gap: 10px;
           align-items: center;
           flex-direction: column-reverse;
       }
    </style>
</head>
<body>
<div class="flex">
  <div class="box red">
      <p>Lorem ipsum dolor.</p>
      <img src="https://logo-marque.com/wp-content/uploads/2020/04/Apple-Logo.png" >
  </div>
  <div class="box yellow"></div>
  <div class="box green"></div>
</div>
</body>
</html>
